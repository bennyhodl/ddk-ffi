packages:
  - packages/*
  - examples/*
  - tests/*

# ESLint 8 resolves shared-config plugins from the consuming package.
publicHoistPattern:
  - '*eslint*'

patchedDependencies:
  '@bennyblader/ddk-ts@0.3.42': tests/compatibility/patches/@bennyblader__ddk-ts@0.3.42.patch
onlyBuiltDependencies:
  - es5-ext
  - esbuild
  - secp256k1
  - tiny-secp256k1
