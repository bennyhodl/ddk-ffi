
[package]
authors = ["benny b <ben@bitcoinbay.foundation>"]
edition = "2021"
name = "ddk_ts"
version = "1.0.0-rc1"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
ddk_ffi = { path = "../ddk-ffi" }

napi = { version = "3.9", default-features = false, features = ["napi9", "serde-json"] }
napi-derive = "3.5"

ddk-dlc = { version = "2.0.0-rc.1", features = ["std", "use-serde"] }
bitcoin = "0.32.7"
thiserror = "2.0.12"
secp256k1-zkp = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hex = "0.4.3"

[build-dependencies]
napi-build = "2.3"

[profile.release]
lto = true
strip = "symbols"
opt-level = 3
