buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        // Pinned to the same NDK the Rust JNI libraries are built with (see
        // publish.yml / ddk-rn.yml / CLAUDE.md). Gradle uses this for the ddk-rn
        // module's CMake C++, cargo-ndk uses it for libddk_ffi.so — one version
        // means CI installs one NDK and the example links what releases ship.
        ndkVersion = "27.3.13750724"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
