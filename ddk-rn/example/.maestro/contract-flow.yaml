# E2E: drives the ddk-rn example through the full DLC contract lifecycle —
# funding AND settlement — on a simulator, asserting the on-device JSI -> Rust
# bindings produce the expected result. This is the only layer that exercises the
# real React Native bindings (the Rust logic itself is covered by the ddk-ffi +
# ddk-ts suites).
appId: ddkrn.example
---
# The whole flow runs inside a retry, and the retry opens by dismissing an
# Android system error dialog if one is on screen.
#
# A system dialog is the one failure that says nothing about the app. When a
# background process ANRs — the Pixel Launcher, on a freshly created emulator,
# while it rebuilds its app list — its "isn't responding" dialog is drawn on top,
# and Maestro dumps only the foreground window. The app disappears from the
# hierarchy while still running and rendering behind the dialog, so whichever
# assertion is next fails, and the screenshot shows a healthy app.
# `scripts/android-suppress-dialogs.sh` stops that dialog being drawn at all;
# this is the second line of defence, for when it is drawn anyway.
#
# It wraps EVERYTHING because the dialog does not arrive at a predictable moment
# — it lands whenever the ANR fires, which can be mid-assertion. Dismissing it
# up front would only cover a dialog that was already there, and that case needs
# no help: `launchApp` takes focus from a pre-existing dialog on its own
# (measured — the pre-retry flow passes with a crash dialog already up). The case
# that actually fails is the dialog arriving later, and the only way to see it
# from a flow is to fail, come back around, and find it waiting.
#
# On iOS the `when` never matches, so the block is skipped and the flow stays
# cross-platform.
#
# No `clearState`. CI installs the app onto a freshly booted device every run, so
# there is nothing to clear, and Maestro implements it on iOS by uninstalling the
# app — visible as an uninstall request in the simulator log of the run that then
# failed against a blank screen.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            visible:
              id: 'android:id/aerr_close'
          commands:
            - tapOn:
                id: 'android:id/aerr_close'

      - launchApp

      # Generous timeout: this covers the app's cold start, including Hermes
      # loading the embedded JS bundle.
      #
      # extendedWaitUntil, not assertVisible: `timeout` is not a property of an
      # element selector, so `assertVisible: {text: ..., timeout: ...}` is a
      # parse error, not a slow assertion. Maestro's own message lists the 28
      # selector properties and `timeout` is not among them. assertVisible waits
      # only for the implicit default, so this is also the only form that
      # actually honours the cold-start budget.
      - extendedWaitUntil:
          visible:
            text: 'DDK · DLC'
          timeout: 60000
      - assertVisible: 'Run the contract flow'

      # Runs createOffer -> validateOffer -> acceptOffer -> validateAccept ->
      # createFundingPsbt -> signFundingPsbtWithDescriptor -> signAccept ->
      # validateSign -> finalizeSign -> signContractCet -> signContractRefund
      # natively, then renders the results.
      - tapOn:
          id: 'run-flow'

      # The payout table proves contractInfoPayouts marshalled correctly across
      # the boundary (enum: up -> offerer 100000, down -> acceptor 100000). The
      # generous timeout covers the async native work; scrolling handles the long
      # result view.
      - scrollUntilVisible:
          element:
            text: '100000 sats'
          timeout: 60000
      - assertVisible: 'up'
      - assertVisible: 'down'

      # The signed funding transaction card.
      - scrollUntilVisible:
          element:
            id: 'flow-success'
      # `(?i)` is required. This text is styled with `cardTitle`, which sets
      # `textTransform: 'uppercase'` — React Native applies that to the string in
      # the native view, so the accessibility tree exposes "✓ SIGNED FUNDING
      # TRANSACTION". Maestro matches `text` as a regex against the element's
      # ENTIRE text, so the literal below would never match. Same trap as the
      # `.*` in the version assertion this file replaces; see the Maestro notes
      # in CLAUDE.md.
      - assertVisible: '(?i)✓ signed funding transaction'

      # Settlement is the success signal for the whole lifecycle: the CET the
      # oracle attestation selects, and the refund transaction, both signed on
      # device from nothing but the three wire messages. Same uppercase caveat on
      # the card title; the CET label is matched with a leading and trailing `.*`
      # because `text` is a full match, not a substring search.
      - scrollUntilVisible:
          element:
            id: 'flow-settled'
          timeout: 60000
      - assertVisible: '(?i)✓ settled'
      - assertVisible: '.*oracle attested "up".*'
      - assertVisible: 'Refund transaction'

      # And the error card must never have appeared.
      - assertNotVisible:
          id: 'flow-error'
