# E2E: drives the ddk-rn example through the full DLC funding flow on a
# simulator, asserting the on-device JSI -> Rust bindings produce the expected
# result. This is the only layer that exercises the real React Native bindings
# (the Rust logic itself is covered by the ddk-ffi + ddk-ts suites).
appId: ddkrn.example
---
# No `clearState`. CI installs the app onto a freshly booted device every run, so
# there is nothing to clear, and Maestro implements it on iOS by uninstalling the
# app — visible as an uninstall request in the simulator log of the run that then
# failed against a blank screen.
- launchApp

# Generous timeout: this covers the app's cold start, including Hermes loading
# the embedded JS bundle.
#
# extendedWaitUntil, not assertVisible: `timeout` is not a property of an element
# selector, so `assertVisible: {text: ..., timeout: ...}` is a parse error, not a
# slow assertion. Maestro's own message lists the 28 selector properties and
# `timeout` is not among them. assertVisible waits only for the implicit default,
# so this is also the only form that actually honours the cold-start budget.
- extendedWaitUntil:
    visible:
      text: 'DDK · DLC'
    timeout: 60000
- assertVisible: 'Run the funding flow'

# Runs createOffer -> validateOffer -> acceptOffer -> validateAccept ->
# createFundingPsbt -> signFundingPsbtWithDescriptor -> signAccept ->
# validateSign -> finalizeSign natively, then renders the results.
- tapOn:
    id: 'run-flow'

# The payout table proves contractInfoPayouts marshalled correctly across the
# boundary (enum: up -> offerer 100000, down -> acceptor 100000). The generous
# timeout covers the async native work; scrolling handles the long result view.
- scrollUntilVisible:
    element:
      text: '100000 sats'
    timeout: 60000
- assertVisible: 'up'
- assertVisible: 'down'

# The signed funding transaction card is the success signal for the whole flow.
- scrollUntilVisible:
    element:
      id: 'flow-success'
# `(?i)` is required. This text is styled with `cardTitle`, which sets
# `textTransform: 'uppercase'` — React Native applies that to the string in the
# native view, so the accessibility tree exposes "✓ SIGNED FUNDING TRANSACTION".
# Maestro matches `text` as a regex against the element's ENTIRE text, so the
# literal below would never match. Same trap as the `.*` in the version
# assertion this file replaces; see the Maestro notes in CLAUDE.md.
- assertVisible: '(?i)✓ signed funding transaction'

# And the error card must never have appeared.
- assertNotVisible:
    id: 'flow-error'
