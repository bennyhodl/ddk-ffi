[package]
name = "ddk_ffi"
version = "1.0.0-rc5"
edition = "2021"
license = "MIT"
description = "rust-dlc language bindings"
repository = "https://github.com/bennyhodl/ddk-ffi"
homepage = "https://github.com/bennyhodl/ddk-ffi"
readme = "README.md"

[lib]
name = "ddk_ffi"
# No rlib: cargo skips LTO for a unit that also produces one.
crate-type = ["cdylib", "staticlib"]

[features]
# uniffi's CLI is a code generator; the staticlib would ship it otherwise.
uniffi-bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
uniffi = { version = "=0.31.0", default-features = false }
ddk = { version = "2.0.0-rc.6", default-features = false }
ddk-dlc = { version = "2.0.0-rc.6", features = ["std", "use-serde"] }
ddk-messages = { version = "2.0.0-rc.6", features = ["std", "use-serde"] }
lightning = { version = "0.2", features = ["std"] }
bitcoin = "0.32.7"
thiserror = "2.0.12"
secp256k1-zkp = "0.11.0"
bip39 = "2.2.0"

# ddk's fallback for settling and splicing contracts built under the fee rule
# before ddk-dlc 2.0.0-rc.4 is not released yet. Pinned to the dlcdevkit commit
# that adds it; replace with the release version in [dependencies] and delete
# this section once it is published.
[patch.crates-io]
ddk = { git = "https://github.com/bennyhodl/dlcdevkit", rev = "8c3ed9c2bffc52ea7ccf913af3368bdfe449ef21" }
ddk-dlc = { git = "https://github.com/bennyhodl/dlcdevkit", rev = "8c3ed9c2bffc52ea7ccf913af3368bdfe449ef21" }
ddk-messages = { git = "https://github.com/bennyhodl/dlcdevkit", rev = "8c3ed9c2bffc52ea7ccf913af3368bdfe449ef21" }
ddk-manager = { git = "https://github.com/bennyhodl/dlcdevkit", rev = "8c3ed9c2bffc52ea7ccf913af3368bdfe449ef21" }
ddk-trie = { git = "https://github.com/bennyhodl/dlcdevkit", rev = "8c3ed9c2bffc52ea7ccf913af3368bdfe449ef21" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi = { version = "=0.31.0", default-features = false, features = [
  "wasm-unstable-single-threaded",
] }
uniffi-runtime-wasm = "=0.31.0-5"
wasm-bindgen = "=0.2.100"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
bip39 = { version = "2.2.0", features = ["rand"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

# No `strip`: ubrn's Android codegen needs the .so's symbol table.
# No `panic = "abort"`: uniffi turns caught panics into caller-side errors.
[profile.release]
lto = true
codegen-units = 1
