[package]
name = "ddk_ffi"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "rust-dlc language bindings"
repository = "https://github.com/bennyhodl/ddk-ffi"
homepage = "https://github.com/bennyhodl/ddk-ffi"
readme = "README.md"

[lib]
name = "ddk_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pinned exactly: uniffi-bindgen-react-native 0.31.0-3 requires uniffi_core =0.31.0.
# A caret range floats to 0.31.x and breaks the generated bindings at typecheck.
uniffi = { version = "=0.31.0", features = ["cli"] }
# The stateless contract + splice API and ContractKeyProvider live in `ddk`.
# `default-features = false` disables the `manager` feature so only the
# lightweight, sync `contract` module is pulled in (no tokio-full / zeromq /
# esplora) — required for iOS/Android cross-compilation. ddk-dlc must resolve to
# the SAME version/source `ddk` uses (1.1.x) so secp256k1_zkp / PartyParams
# types unify across the FFI boundary.
#
# All three point at the `stateless-dlc-creation` branch until it lands on
# dlcdevkit master and is published to crates.io. To develop against a local
# dlcdevkit checkout, swap these for path deps (e.g. `path = "../../dlcdevkit/ddk"`)
# — but don't commit that: path deps break CI and every downstream consumer.
ddk = { git = "https://github.com/bennyhodl/dlcdevkit.git", branch = "stateless-dlc-creation", default-features = false }
ddk-dlc = { git = "https://github.com/bennyhodl/dlcdevkit.git", branch = "stateless-dlc-creation", features = ["std", "use-serde"] }
# ddk-messages provides the wire types (OfferDlc/AcceptDlc/SignDlc/ContractInfo/
# FundingInput) marshalled across the FFI boundary as `Vec<u8>`; lightning
# provides the Writeable/Readable (TLV) encoding those types use. Both are
# version-matched to `ddk` so the types unify.
ddk-messages = { git = "https://github.com/bennyhodl/dlcdevkit.git", branch = "stateless-dlc-creation", features = ["std", "use-serde"] }
lightning = { version = "0.2", features = ["std"] }
bitcoin = "0.32.7"
thiserror = "2.0.12"
secp256k1-zkp = "0.11.0"
bip39 = "2.2.0"

# ddk-ts depends on this crate by path and builds it for wasm32-wasip1-threads,
# which drags uniffi_core in even though ddk-ts is napi, not uniffi.
#
# uniffi_core 0.31 declares `UniffiCompatibleFuture` with a `Send` bound unless
# this feature is on, but its wasm32 blanket impl omits `Send` — so on wasm32
# without the feature the two disagree and the crate fails to compile with
# "`F` cannot be sent between threads safely". Futures on wasm32 are not `Send`
# (it is single-threaded), which is exactly what this feature exists to express.
#
# Target-scoped, so iOS, Android and host builds are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi = { version = "=0.31.0", features = ["cli", "wasm-unstable-single-threaded"] }

[dev-dependencies]
bip39 = {version = "2.2.0", features = ["rand"]}

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
