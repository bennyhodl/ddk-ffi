name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

env:
  # Read by cargo when building the ddk-ts cdylib on macOS. APP_NAME lived here
  # too; it was napi-rs's, and nothing reads it now that ddk-ts is generated.
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  # Keep in sync with ci.yml's NDK_VERSION and the example app's ndkVersion.
  NDK_VERSION: '27.1.12297006'

jobs:
  verify-version:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag and verify package versions
        id: extract
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          TS_VERSION=$(node -p "require('./ddk-ts/package.json').version")
          RN_VERSION=$(node -p "require('./ddk-rn/package.json').version")
          echo "ddk-ts: $TS_VERSION"
          echo "ddk-rn: $RN_VERSION"

          if [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match ddk-ts package.json version $TS_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$RN_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match ddk-rn package.json version $RN_VERSION"
            exit 1
          fi

          # The Cargo side too. ddk-ffi's version is consumer-visible — its
          # `version()` binding returns env!("CARGO_PKG_VERSION"), to BOTH
          # packages — and the lockfile records the crate's own version, so a
          # stale one makes the next `cargo build` dirty the tree and blocks the
          # following release. Checking only the package.json files is how
          # ddk-ts/Cargo.toml sat at 0.3.43 through the v0.4.0 release without
          # anything noticing; ddk-ts has no Cargo.toml now, because it is
          # generated from this crate.
          check_toml() {
            local file="$1" actual
            actual=$(grep -m1 '^version = ' "$file" | sed 's/version = "\(.*\)"/\1/')
            echo "$file: $actual"
            if [ "$TAG_VERSION" != "$actual" ]; then
              echo "::error::Tag $TAG_VERSION does not match $file version $actual"
              exit 1
            fi
          }
          check_lock() {
            local file="$1" crate="$2" actual
            actual=$(grep -A1 "^name = \"$crate\"\$" "$file" | grep -m1 '^version = ' | sed 's/version = "\(.*\)"/\1/')
            echo "$file [$crate]: $actual"
            if [ "$TAG_VERSION" != "$actual" ]; then
              echo "::error::Tag $TAG_VERSION does not match $crate in $file ($actual)"
              exit 1
            fi
          }
          check_toml ddk-ffi/Cargo.toml
          check_lock ddk-ffi/Cargo.lock ddk_ffi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  # ddk-ts is GENERATED from ddk-ffi (see ddk-ts/DEVELOPMENT.md): each host
  # builds the release cdylib for its own target, regenerates the bindings from
  # it, and assembles platform/<node-triple>/ — a complete npm package carrying
  # that one library. dist/ (the compiled TypeScript) is identical from either
  # host; publish-ddk-ts takes whichever arrives.
  build-ddk-ts:
    name: Build ddk-ts (${{ matrix.short }})
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            short: darwin-arm64
            lib: libddk_ffi.dylib
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            short: linux-x64-gnu
            lib: libddk_ffi.so
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install uniffi-bindgen-react-native
        run: npm install -g uniffi-bindgen-react-native@0.31.0-3
      - name: Install dependencies
        run: cd ddk-ts && pnpm install --frozen-lockfile
      - name: Build
        run: cd ddk-ts && node scripts/build-release.mjs --target ${{ matrix.target }}
      - name: Verify the platform package carries its library
        run: |
          F=ddk-ts/platform/${{ matrix.short }}/${{ matrix.lib }}
          [ -f "$F" ] || { echo "::error::$F was not produced"; exit 1; }
          ls -la "ddk-ts/platform/${{ matrix.short }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddk-ts-bindings-${{ matrix.target }}
          path: |
            ddk-ts/dist/
            ddk-ts/platform/
          if-no-files-found: error

  test-ddk-ts:
    name: Test ddk-ts
    needs: [verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install uniffi-bindgen-react-native
        run: npm install -g uniffi-bindgen-react-native@0.31.0-3
      - name: Install dependencies
        run: cd ddk-ts && pnpm install --frozen-lockfile
      - name: Generate + build
        run: cd ddk-ts && pnpm generate
      - name: Test
        run: cd ddk-ts && pnpm test
      # The bindings are generated, so ddk-ts cannot drift from ddk-ffi — but a
      # stale committed copy can, and that is what would ship.
      - name: Committed bindings match the crate
        run: git diff --exit-code ddk-ts/src

  test-ddk-rn:
    name: Test ddk-rn
    needs: [verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install uniffi-bindgen-react-native
        run: npm install -g uniffi-bindgen-react-native@0.31.0-3
      - uses: extractions/setup-just@v1
      - name: Generate JSI bindings
        run: just uniffi-jsi
      - name: Generate TurboModule bindings
        run: just uniffi-turbo
      - name: Install dependencies
        run: cd ddk-rn && pnpm install
      - name: Build
        run: cd ddk-rn && pnpm prepare
      - name: Test
        run: cd ddk-rn && pnpm test

  # Nothing is built here: this job only assembles what the two build hosts
  # produced and publishes it. No Rust toolchain, no bindgen.
  publish-ddk-ts:
    name: Publish @bennyblader/ddk-ts
    needs: [test-ddk-ts, build-ddk-ts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # merge-multiple: both artifacts carry the same dist/ (the compiled
      # bindings are host-independent) and one platform/<triple>/ each, so they
      # overlay into a single tree.
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: ddk-ts
          pattern: ddk-ts-bindings-*
          merge-multiple: true
      - name: Show what will be published
        run: |
          ls -la ddk-ts/dist ddk-ts/platform
          for d in ddk-ts/platform/*/; do echo "--- $d"; ls -la "$d"; done
      # NPM_CONFIG_TAG rather than `npm publish --tag`: publish-release.mjs
      # publishes each platform package with a bare `npm publish` of its own,
      # which takes no tag argument but does inherit the environment. Setting the
      # config env var covers the platform packages and the main package at once.
      #
      # Without it every publish lands on `latest` — npm does not infer a tag
      # from a prerelease version — so a `v1.0.0-rc1` tag would make the RC the
      # default install for everyone.
      #
      # Platform packages go FIRST; the main package's optionalDependencies point
      # at them, and npm resolves those at install time. publish-release.mjs
      # enforces the order and injects the optionalDependencies.
      - name: Publish (platform packages, then main)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd ddk-ts
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *-*) export NPM_CONFIG_TAG=next ;; *) export NPM_CONFIG_TAG=latest ;; esac
          echo "Publishing $VERSION to dist-tag $NPM_CONFIG_TAG"
          npm config set provenance true
          node scripts/publish-release.mjs

  # ddk-rn ships PREBUILT native binaries so that `npm install` never compiles
  # anything on a consumer's machine. That requires two build hosts: the iOS
  # XCFramework needs `xcodebuild -create-xcframework`, which only exists on
  # macOS, while the Android JNI archives need the NDK. Each uploads its
  # binaries as an artifact; publish-ddk-rn assembles them into one package.
  build-ddk-rn-ios:
    name: Build ddk-rn iOS XCFramework
    needs: [verify-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install uniffi-bindgen-react-native
        run: npm install -g uniffi-bindgen-react-native@0.31.0-3
      - uses: extractions/setup-just@v1
      - name: Install ddk-rn dependencies
        run: cd ddk-rn && pnpm install
      - name: Generate JSI bindings
        run: just uniffi-jsi
      - name: Generate TurboModule bindings
        run: just uniffi-turbo
      # Release + stripped; see the comment above `build-ios` in the justfile.
      - name: Build XCFramework
        run: just build-ios
      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: ddk-rn-ios-xcframework
          path: ddk-rn/ios/DdkRn.xcframework
          if-no-files-found: error
      # The bindings are regenerated here by `--and-generate`, so publish takes
      # them from this job rather than regenerating a third time.
      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: ddk-rn-generated-bindings
          path: |
            ddk-rn/src
            ddk-rn/cpp
          if-no-files-found: error

  build-ddk-rn-android:
    name: Build ddk-rn Android JNI libraries
    needs: [verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install uniffi-bindgen-react-native
        run: npm install -g uniffi-bindgen-react-native@0.31.0-3
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: extractions/setup-just@v1
      - name: Install ddk-rn dependencies
        run: cd ddk-rn && pnpm install
      # ubrn shells out to `cargo ndk`, which resolves the toolchain from
      # ANDROID_NDK_HOME.
      #
      # Pinned rather than taken from ANDROID_NDK_LATEST_HOME: that variable
      # tracks whatever the runner image ships (r29 at time of writing) and
      # moves without warning, so a release could be built by a toolchain
      # nobody tested against. r27 is the first release to default to 16KB
      # page alignment. Keep this in sync with what you install locally.
      #
      # Installed rather than asserted (same as ci.yml): the runner image only
      # preinstalls a handful of NDKs and rotates them out without notice — it
      # dropped 27.1.12297006 for 27.3.13750724, which turned every release
      # into a hard failure. The pin deliberately does not track the image, so
      # fetch it when it is absent instead of depending on it being there.
      - name: Pin the NDK
        run: |
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_HOME" ]; then
            echo "NDK $NDK_VERSION not preinstalled; installing. Present:"
            ls "$ANDROID_SDK_ROOT/ndk" || true
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              --install "ndk;$NDK_VERSION" >/dev/null
          fi
          [ -d "$NDK_HOME" ] || { echo "::error::NDK $NDK_VERSION unavailable"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - name: Build JNI libraries
        run: |
          echo "Using NDK at $ANDROID_NDK_HOME"
          just build-android
      - name: Upload JNI libraries
        uses: actions/upload-artifact@v4
        with:
          name: ddk-rn-android-jnilibs
          path: ddk-rn/android/src/main/jniLibs
          if-no-files-found: error

  publish-ddk-rn:
    name: Publish @bennyblader/ddk-rn
    needs: [test-ddk-rn, build-ddk-rn-ios, build-ddk-rn-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # No Rust toolchain and no ubrn here: every native artifact and every
      # generated binding arrives as an artifact from the two build jobs.
      - name: Download generated bindings
        uses: actions/download-artifact@v4
        with:
          name: ddk-rn-generated-bindings
          path: ddk-rn
      - name: Download iOS XCFramework
        uses: actions/download-artifact@v4
        with:
          name: ddk-rn-ios-xcframework
          path: ddk-rn/ios/DdkRn.xcframework
      - name: Download Android JNI libraries
        uses: actions/download-artifact@v4
        with:
          name: ddk-rn-android-jnilibs
          path: ddk-rn/android/src/main/jniLibs
      - name: Install ddk-rn dependencies
        run: cd ddk-rn && pnpm install
      - name: Build
        run: cd ddk-rn && pnpm prepare
      # Fail loudly rather than publishing a package that would make consumers
      # compile Rust — the exact failure mode this pipeline exists to prevent.
      - name: Verify binaries are in the tarball
        run: |
          cd ddk-rn
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          # The simulator slice is named for the archs it contains
          # (ios-arm64-simulator, ios-arm64_x86_64-simulator, ...), so match the
          # suffix rather than pinning a name that changes with the target list.
          check() {
            if ! grep -qE "$1" /tmp/pack.txt; then
              echo "::error::Missing $2 from the npm tarball"
              exit 1
            fi
          }
          check 'ios/DdkRn\.xcframework/ios-arm64/libddk_ffi\.a' 'iOS device slice'
          check 'ios/DdkRn\.xcframework/ios-[^/]*simulator/libddk_ffi\.a' 'iOS simulator slice'
          # .so, not .a — Android links a shared library. A static archive here
          # would still build, but silently multiply the package size ~10x.
          check 'android/src/main/jniLibs/arm64-v8a/libddk_ffi\.so' 'Android arm64-v8a shared library'
          if grep -q 'jniLibs/[^/]*/libddk_ffi\.a' /tmp/pack.txt; then
            echo "::error::Android shipped a static archive; expected a shared library (android.useSharedLibrary)"
            exit 1
          fi
          if grep -qE 'ddk-ffi/(src|Cargo)' /tmp/pack.txt; then
            echo "::error::Rust source leaked into the tarball"
            exit 1
          fi
          echo "✅ prebuilt binaries present, no Rust source"
      # See the note on the ddk-ts publish step: a prerelease version must not
      # take over the `latest` dist-tag.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd ddk-rn
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *-*) export NPM_CONFIG_TAG=next ;; *) export NPM_CONFIG_TAG=latest ;; esac
          echo "Publishing $VERSION to dist-tag $NPM_CONFIG_TAG"
          npm config set provenance true
          npm publish --access public

  # Runs only after both packages are on npm, so the notes never describe a
  # release that did not happen. Deliberately cannot fail the workflow: the
  # publish is already irreversible by this point, and prose is not worth a red
  # run. scripts/release-notes.js falls back to a plain commit list if
  # ANTHROPIC_API_KEY is missing or the API call fails.
  github-release:
    name: Create GitHub release
    needs: [publish-ddk-ts, publish-ddk-rn]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-notes.js diffs against the previous tag
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$VERSION" > /tmp/notes.md || true
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::Release notes came out empty; falling back to GitHub's generator"
            rm -f /tmp/notes.md
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" --notes-file /tmp/notes.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" --generate-notes
          fi
